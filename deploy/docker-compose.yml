# Nextflix stack. Run from the repo root:
#   docker compose -f deploy/docker-compose.yml up -d --build
# Copy deploy/config/*.env.example to *.env first.
name: nextflix

# Cap docker logs per container (30 MB max)
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  server:
    build:
      context: ../server
      dockerfile: ../deploy/server.Dockerfile
    ports:
      - "8252:8252"
    env_file:
      # Optional so "compose config" works before setup; copy server.env.example first
      - path: ./config/server.env
        required: false
    environment:
      - PORT=8252
      - DATABASE_URL=/app/data/nextflix.db
      - REDIS_URL=redis://redis:6379/0
      - TORRSERVER_URL=http://torrserver:8090
      - TV_APP_DIR=/app/tv
      # TV playback diagnostics, one file per day kept 14 days (scripts/playback-log.sh)
      - PLAYBACK_LOG_DIR=/app/data/playback-logs
      - JACKETT_URL=http://jackett:9117
    volumes:
      # SQLite lives in a named volume (WAL/mmap is unreliable on /mnt/c bind mounts)
      - db:/app/data
      # Built TV app, served at /tv/ for the TV's own browser (tv/webos/scripts/build.sh).
      # Fails instead of mounting an empty folder when it has not been built yet.
      - type: bind
        source: ../tv/webos/dist
        target: /app/tv
        read_only: true
        bind:
          create_host_path: false
    networks: [frontend, backend, cache]
    depends_on:
      # Notifications are turned off when Redis is not up at boot
      redis:
        condition: service_healthy
      # Waits until they answer, so the first search/stream works; optional so a broken one
      # does not keep the server down
      jackett:
        condition: service_healthy
        required: false
      torrserver:
        condition: service_healthy
        required: false
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: *logging
    restart: unless-stopped

  web:
    build:
      context: ../web
      dockerfile: ../deploy/web.Dockerfile
      args:
        # Baked in at build time: /api rewrites and server-side calls go to this address
        BACKEND_INTERNAL_URL: http://server:8252
    ports:
      - "3008:3008"
      # http://nextflix.local without a port number (LAN only, see the mdns service)
      - "80:3008"
    env_file:
      - path: ./config/web.env
        required: false
    environment:
      - NODE_ENV=production
      - PORT=3008
    # Only talks to server and tvapp
    networks: [frontend]
    depends_on:
      server:
        condition: service_healthy
        required: false
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: *logging
    restart: unless-stopped

  # The built TV app (tv/webos/scripts/build.sh), reached through web at http://tv.nextflix.local and /tv/
  tvapp:
    image: nginx:1.30.5-alpine
    volumes:
      - type: bind
        source: ../tv/webos/dist
        target: /usr/share/nginx/html
        read_only: true
        bind:
          create_host_path: false
    networks: [frontend]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    # Master starts as root, binds :80, creates its cache dirs and switches workers to "nginx"
    cap_add: [CHOWN, SETUID, SETGID, NET_BIND_SERVICE]
    logging: *logging
    restart: unless-stopped

  # Announces nextflix.local on the LAN (mDNS); needs the host network to reach multicast
  mdns:
    build:
      context: ./mdns
    network_mode: host
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: *logging
    restart: unless-stopped

  redis:
    image: redis:8.10.2-alpine
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    # Internal network: no internet access, only server reaches it
    networks: [cache]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep -q PONG"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    # The entrypoint fixes /data ownership as root, then drops to the "redis" user
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETUID, SETGID]
    logging: *logging
    restart: unless-stopped

  jackett:
    image: lscr.io/linuxserver/jackett:v0.24.2810-ls53
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=UTC
      # Version is pinned by the image tag; update by changing the tag
      - AUTO_UPDATE=false
    volumes:
      - ${JACKETT_CONFIG_DIR:-./data/jackett}:/config
    ports:
      - "127.0.0.1:9117:9117"
    networks: [backend]
    depends_on:
      # Cloudflare-protected indexers need it; optional so Jackett still starts without it
      flaresolverr:
        condition: service_healthy
        required: false
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:9117/UI/Login"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s
    # No cap_drop: s6-overlay starts as root and needs to chown /config and switch users
    security_opt: [no-new-privileges:true]
    logging: *logging
    restart: unless-stopped

  # Solves Cloudflare challenges for Jackett indexers like 1337x (internal only).
  # Keep the service name: Jackett's config points to http://flaresolverr:8191.
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:v3.5.2
    environment:
      - LOG_LEVEL=info
      - TZ=UTC
    networks: [backend]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8191/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
      start_interval: 2s
    # Runs as a non-root user and starts Chromium with --no-sandbox
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: *logging
    restart: unless-stopped

  # One-shot: gives torrserver-data (root-owned on older installs) to the user TorrServer runs as
  torrserver-init:
    image: alpine:3.24.2
    command: ["find", "/opt/ts", "(", "!", "-user", "1000", "-o", "!", "-group", "1000", ")",
              "-exec", "chown", "-h", "1000:1000", "{}", "+"]
    volumes:
      - torrserver-data:/opt/ts
    network_mode: none
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_READ_SEARCH]
    logging: *logging
    restart: "no"

  # Streams torrents over HTTP while they download (used by the "Watch" button)
  torrserver:
    image: ghcr.io/yourok/torrserver:MatriX.146
    # Non-root: it is the only service reachable from the internet (peer port)
    user: "1000:1000"
    depends_on:
      torrserver-init:
        condition: service_completed_successfully
    environment:
      - TS_PORT=8090
      - TS_CONF_PATH=/opt/ts/config
      - TS_TORR_DIR=/opt/ts/torrents
    volumes:
      - torrserver-data:/opt/ts
    ports:
      - "127.0.0.1:8090:8090"
      # BitTorrent peer port only (forwarded on the router); the API above stays local
      - "41413:41413/tcp"
      - "41413:41413/udp"
    networks: [backend]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8090/echo"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
      start_interval: 2s
    # Only binds ports above 1024, so no capabilities are needed
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    logging: *logging
    restart: unless-stopped

networks:
  # web, server and tvapp
  frontend:
  # server and the services it calls (they need internet access)
  backend:
  # server and redis only, no internet
  cache:
    internal: true

volumes:
  db:
  redis-data:
  torrserver-data:
