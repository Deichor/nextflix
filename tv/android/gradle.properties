# App version: the single place (scripts/build.sh reads it too)
nextflix.versionName=0.1.1
nextflix.versionCode=2

# Low RAM in WSL: one small Gradle JVM, Kotlin compiled inside it
org.gradle.jvmargs=-Xmx2g -XX:MaxMetaspaceSize=512m -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.workers.max=2
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configuration-cache=true
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=true

android.useAndroidX=true
android.nonTransitiveRClass=true
